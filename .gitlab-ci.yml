stages:
  - build_and_deploy

deploy_multiplayer:
  stage: build_and_deploy
  tags:
    - nodejs
  script:
    - echo "🚀 Memulai Build Colyseus (Server) & Vite (Client)..."

    # 1. Build Client (Vite)
    - cd client && npm install && npm run build && cd ..

    # 2. Build Server (Colyseus)
    - cd server && npm install && npm run build && cd ..

    # 3. Kirim hasil build ke aaPanel (EXCLUDE file yang tidak perlu)
    - rsync -az --delete
        ./server/build/ root@192.168.1.157:/www/wwwroot/MultiplayerGameQuiz/server/build/

    - rsync -az
        ./server/public/ root@192.168.1.157:/www/wwwroot/MultiplayerGameQuiz/server/public/

    - rsync -az
        ./server/package.json
        root@192.168.1.157:/www/wwwroot/MultiplayerGameQuiz/server/

    - rsync -az
        ./server/ecosystem.config.js
        root@192.168.1.157:/www/wwwroot/MultiplayerGameQuiz/server/

    - rsync -az --delete
        ./shared/ root@192.168.1.157:/www/wwwroot/MultiplayerGameQuiz/shared/

    # 4. Eksekusi di Server aaPanel
    - ssh -o StrictHostKeyChecking=no root@192.168.1.157 "
        cd /www/wwwroot/MultiplayerGameQuiz/server &&
        mkdir -p logs &&
        npm install --production --no-audit &&
        pm2 startOrReload ecosystem.config.js --update-env &&
        pm2 save &&
        echo '✅ Colyseus Server & Vite Client Berhasil Update!'
      "
  only:
    - main
